<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pyxos{% endblock %} — Pyxos</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom Glassmorphism CSS -->
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📦</text></svg>">
</head>
<body>

    <!-- Overlay for Mobile Sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Mobile Header Navigation -->
    <header class="mobile-header">
        <div class="d-flex align-items-center gap-2 fw-bold text-dark">
            <i class="bi bi-box-seam fs-4 text-primary"></i>
            <span>Pyxos</span>
        </div>
        <button class="btn btn-outline-secondary p-2" id="sidebarToggle" aria-label="Toggle Navigation">
            <i class="bi bi-list fs-4"></i>
        </button>
    </header>

    <div class="d-flex" id="wrapper">
        <!-- Sidebar Navigation -->
        <div class="sidebar" id="sidebar-wrapper">
            <div class="sidebar-heading">
                <i class="bi bi-box-seam"></i> Pyxos
            </div>
            <div class="list-group list-group-flush py-3">
                <a href="/" class="list-group-item {% if request.path == '/' %}active{% endif %}">
                    <i class="bi bi-grid-1x2"></i> Dashboard
                </a>
                <a href="/projects" class="list-group-item {% if request.path.startswith('/projects') %}active{% endif %}">
                    <i class="bi bi-folder2"></i> Projects
                </a>
                <a href="/stats" class="list-group-item {% if request.path == '/stats' %}active{% endif %}">
                    <i class="bi bi-bar-chart-line"></i> Statistics
                </a>
                <a href="/config" class="list-group-item {% if request.path == '/config' %}active{% endif %}">
                    <i class="bi bi-sliders2"></i> Configuration
                </a>
            </div>
            <div class="sidebar-footer">
                Pyxos v1.0.0
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper" class="w-100">
            <div class="container-fluid py-4 px-3 px-md-5">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Mobile Navigation Toggle Script -->
    <script>
        const sidebar = document.getElementById('sidebar-wrapper');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            sidebar.classList.toggle('show');
            sidebarOverlay.classList.toggle('show');
        }

        if (sidebarToggle) {
            sidebarToggle.addEventListener('click', toggleSidebar);
        }
        if (sidebarOverlay) {
            sidebarOverlay.addEventListener('click', toggleSidebar);
        }
    </script>
</body>
</html>
