{% extends "base.html" %}
{% block title %}Error{% endblock %}
{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height: 65vh;">
    <div class="card text-center p-4 p-md-5" style="max-width: 500px; width: 100%;">
        <div class="stat-icon amber mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h3 class="fw-bold mb-2">Something went wrong</h3>
        <p class="text-secondary mb-4">{{ message or 'An unexpected error occurred.' }}</p>
        <div>
            <a href="/" class="btn btn-primary px-4"><i class="bi bi-house me-2"></i> Go to Dashboard</a>
        </div>
    </div>
</div>

{% endblock %}
